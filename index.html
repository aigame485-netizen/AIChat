<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AIChat</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
  // テーマはCSSより先に決めて、起動時の白いちらつきを防ぐ
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="css/style.css?v=20261013">
<script type="importmap">
{
  "imports": {
    "@anthropic-ai/sdk": "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm",
    "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.2/+esm",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.1.6/+esm",
    "./js/app.js": "./js/app.js?v=20261013",
    "./js/api.js": "./js/api.js?v=20261013",
    "./js/db.js": "./js/db.js?v=20261013",
    "./js/crypto.js": "./js/crypto.js?v=20261013",
    "./js/pricing.js": "./js/pricing.js?v=20261013"
  }
}
</script>
<script type="module" src="js/app.js?v=20261013"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnMenu" aria-label="会話一覧">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title" id="convTitle">新しい会話</div>
    <button class="icon-btn" id="btnSettings" aria-label="設定">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="offline" id="offline" hidden>接続なし</div>

  <main class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="empty-logo">✳</div>
      <div>なんでも聞いてください</div>
    </div>
  </main>

  <footer class="composer">
    <div class="tools">
      <button class="chip" id="btnModel"><span id="modelLabel">Sonnet</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="chip toggle" id="btnSearch" aria-pressed="false" title="Web検索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>検索</span>
      </button>
      <span class="spacer"></span>
      <span class="cache" id="cacheTimer" title="キャッシュの残り時間"></span>
    </div>
    <div class="attach-preview" id="attachPreview"></div>
    <div class="input-row">
      <button class="icon-btn" id="btnPhoto" aria-label="写真を添付">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="メッセージ"></textarea>
      <button class="send-btn" id="btnSend" aria-label="送信" disabled>
        <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      </button>
    </div>
  </footer>
</div>

<!-- 会話一覧（左から出る） -->
<div class="scrim" id="drawerScrim" hidden></div>
<nav class="drawer" id="drawer" aria-hidden="true">
  <button class="new-conv" id="btnNew">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新しい会話
  </button>
  <div class="conv-list" id="convList"></div>
  <div class="drawer-hint">長押しで名前変更・削除</div>
</nav>

<!-- モデル選択シート（下から出る） -->
<div class="scrim" id="sheetScrim" hidden></div>
<div class="sheet" id="modelSheet" aria-hidden="true">
  <div class="sheet-grip"></div>
  <div class="sheet-label">モデル</div>
  <div class="seg" id="segModel"></div>
  <div class="sheet-label">思考</div>
  <div class="seg" id="segThink"></div>
  <div class="sheet-note" id="thinkNote"></div>
</div>

<!-- 設定 -->
<section class="page" id="settings" aria-hidden="true">
  <header class="topbar">
    <button class="icon-btn" id="btnSettingsClose" aria-label="戻る">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div class="title">設定</div>
    <span class="icon-btn"></span>
  </header>
  <div class="page-body">
    <h2>今月の利用額</h2>
    <div class="card">
      <div class="cost-big" id="costNow">$0.00</div>
      <div class="muted" id="costSub"></div>
      <div class="bar"><div class="bar-fill" id="costBar"></div></div>
      <div class="cost-models" id="costModels"></div>
      <details class="cost-history"><summary>過去の月</summary><div id="costHistory"></div></details>
    </div>

    <h2>APIキー</h2>
    <div class="card">
      <div class="muted" id="keyStatus">未登録</div>
      <label>暗号文<textarea id="keyCipher" rows="3" autocomplete="off" spellcheck="false" placeholder="v1. から始まる文字列"></textarea></label>
      <label>合言葉<input id="keyPass" type="password" autocomplete="off"></label>
      <div class="row">
        <button class="btn primary" id="btnKeySave">保存</button>
        <button class="btn" id="btnKeyClear">削除</button>
      </div>
    </div>

    <h2>システムプロンプト</h2>
    <div class="card">
      <textarea id="systemPrompt" rows="5" placeholder="例: やさしい口調で、要点を短く答えてください。"></textarea>
      <div class="muted small">新しく始めた会話から反映されます。</div>
    </div>

    <h2>新しい会話の初期設定</h2>
    <div class="card">
      <label>モデル<select id="defModel"></select></label>
      <label>思考<select id="defThink"></select></label>
    </div>

    <h2>表示</h2>
    <div class="card">
      <div class="sheet-label">テーマ</div>
      <div class="seg" id="segTheme"></div>
      <label>1ドル＝<input id="yenRate" type="number" inputmode="decimal" min="1" step="1">円</label>
      <label>月の上限＝$<input id="budget" type="number" inputmode="decimal" min="1" step="1"></label>
    </div>

    <h2>履歴</h2>
    <div class="card">
      <div class="row">
        <button class="btn" id="btnExport">書き出し</button>
        <button class="btn" id="btnImport">読み込み</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="muted small">書き出したファイルを読み込むと、同じ会話は新しい方で上書きされます。</div>
    </div>
    <div class="muted small center">AIChat v20261011</div>
  </div>
</section>

<!-- 汎用ダイアログ -->
<div class="dialog-wrap" id="dialog" hidden>
  <div class="dialog">
    <div class="dialog-msg" id="dialogMsg"></div>
    <input id="dialogInput" hidden>
    <div class="dialog-btns" id="dialogBtns"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
</body>
</html>
