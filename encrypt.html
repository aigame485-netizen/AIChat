<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AIChat キー暗号化</title>
<style>
  :root { --bg: #fff; --soft: #f4f4f4; --text: #0d0d0d; --muted: #6b6b6b; --line: #e5e5e5; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #212121; --soft: #303030; --text: #ececec; --muted: #a0a0a0; --line: #3d3d3d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; }
  p, li { color: var(--muted); font-size: 14px; }
  label { display: block; margin: 14px 0 4px; font-size: 14px; }
  input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  textarea { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  button { margin-top: 16px; font: inherit; padding: 9px 20px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); cursor: pointer; }
  .msg { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>APIキーの暗号化</h1>
  <p>このページは入力内容をどこにも保存・送信しません。暗号化はこのブラウザの中だけで行われ、閉じれば消えます。</p>
  <ol>
    <li>APIキーと合言葉を入れて「暗号化」</li>
    <li>出てきた暗号文をLINEで送る</li>
    <li>合言葉は口頭で伝える（LINEに書かない）</li>
  </ol>
  <form id="f" autocomplete="off">
    <label>APIキー<input id="key" type="password" autocomplete="off" spellcheck="false"></label>
    <label>合言葉（8文字以上）<input id="pass" type="password" autocomplete="new-password"></label>
    <label>合言葉（確認）<input id="pass2" type="password" autocomplete="new-password"></label>
    <button type="submit">暗号化</button>
  </form>
  <label>暗号文<textarea id="out" rows="4" readonly></textarea></label>
  <button id="copy" type="button">コピー</button>
  <div class="msg" id="msg"></div>
</main>
<script type="module">
  import { encryptText, decryptText } from './js/crypto.js?v=20261011';
  const $ = (id) => document.getElementById(id);
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    const key = $('key').value.trim(), pass = $('pass').value;
    if (!key) return ($('msg').textContent = 'APIキーを入れてください');
    if (pass.length < 8) return ($('msg').textContent = '合言葉は8文字以上にしてください');
    if (pass !== $('pass2').value) return ($('msg').textContent = '合言葉が一致しません');
    const cipher = await encryptText(key, pass);
    // 念のため戻せることを確かめる
    if ((await decryptText(cipher, pass)) !== key) return ($('msg').textContent = '暗号化に失敗しました');
    $('out').value = cipher;
    $('key').value = '';
    $('msg').textContent = '暗号化しました。APIキー欄は消去済みです。';
  };
  $('copy').onclick = async () => {
    if (!$('out').value) return;
    await navigator.clipboard.writeText($('out').value);
    $('msg').textContent = 'コピーしました';
  };
</script>
</body>
</html>
